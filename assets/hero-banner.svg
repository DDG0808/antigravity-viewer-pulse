      <circle cx="26" cy="110" r="12" fill="#A78BFA" fill-opacity="0.18"/>
      <path d="M21 113 L25 107 L28 111 L32 104" stroke="#C084FC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
