      <path d="M285 35 L290 27 L295 35 Z" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>
      <text x="312" y="28" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">5h + 周额度双池透视</text>
      <text x="312" y="47" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12">Claude/GPT 与 Gemini 同屏</text>

