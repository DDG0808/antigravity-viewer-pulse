    <text x="0" y="242" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="400">5h + 周限额双共享额度池与真实 tok/s 吞吐，支持免重启热更新。</text>

