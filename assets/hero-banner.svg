        <rect x="284" y="66" width="75" height="7" rx="3.5" fill="url(#barCyan)"/>
        <text x="428" y="74" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">55%</text>
        <text x="258" y="95" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10.5">5h 重置 3h40m · 周重置 周六</text>
