    <!-- Main Headline -->
    <text x="0" y="102" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">Antigravity 实时遥测</text>
    <text x="0" y="164" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="800" letter-spacing="-0.5">Spatial Bento 驾驶舱</text>

