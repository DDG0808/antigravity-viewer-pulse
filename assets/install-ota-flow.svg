<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" fill="none">
  <defs>
    <linearGradient id="bgFlow" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070C17"/>
      <stop offset="100%" stop-color="#0B1324"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bgFlow)"/>
  <rect x="1" y="1" width="1278" height="358" rx="23" stroke="#1E293B" stroke-width="2"/>

  <text x="52" y="54" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="23" font-weight="800">从安装、守护到在线升级 —— 全自动闭环省心体验</text>
  <text x="52" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">无需折腾命令行环境，装好一次即可长期稳定运行</text>

  <!-- Step 1 -->
  <g transform="translate(48, 112)">
    <rect width="368" height="206" rx="18" fill="#0E172A" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.4"/>
    <circle cx="40" cy="40" r="18" fill="#0EA5E9" fill-opacity="0.18"/>
    <text x="31" y="45" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">01</text>
    <text x="70" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700">30 秒双击一键安装</text>

    <text x="26" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• macOS：双击「安装 Antigravity Pulse.command」</text>
    <text x="26" y="112" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• Windows：双击「install.bat」（免装 Node.js）</text>
    <text x="26" y="140" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• Linux：终端运行 ./install.sh</text>

    <rect x="26" y="160" width="316" height="28" rx="8" fill="#09101E"/>
    <text x="38" y="178" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">自动备份原生 app.asar，随时一键无损还原</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M426 215 H448 M442 209 L449 215 L442 221" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <g transform="translate(456, 112)">
    <rect width="368" height="206" rx="18" fill="#0E172A" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.4"/>
    <circle cx="40" cy="40" r="18" fill="#10B981" fill-opacity="0.18"/>
    <text x="31" y="45" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">02</text>
    <text x="70" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700">官方客户端升级自动自愈</text>

    <text x="26" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• 注册 macOS 原生 launchd 文件变动监听</text>
    <text x="26" y="112" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• 平时后台 0 内存常驻，仅在文件覆盖时唤醒</text>
    <text x="26" y="140" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• 官方自动更新后数秒内静默重注与修复签名</text>

    <rect x="26" y="160" width="316" height="28" rx="8" fill="#09101E"/>
    <text x="38" y="178" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">再也不用每次客户端更新后重新手动装插件</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M834 215 H856 M850 209 L857 215 L850 221" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <g transform="translate(864, 112)">
    <rect width="368" height="206" rx="18" fill="#0E172A" stroke="#C084FC" stroke-opacity="0.42" stroke-width="1.4"/>
    <circle cx="40" cy="40" r="18" fill="#A855F7" fill-opacity="0.18"/>
    <text x="31" y="45" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">03</text>
    <text x="70" y="46" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17" font-weight="700">SHA-256 在线免重启热更新</text>

    <text x="26" y="84" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• 自动订阅 GitHub Releases 新版红点提醒</text>
    <text x="26" y="112" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• 严格比对 checksums.txt SHA-256 防篡改</text>
    <text x="26" y="140" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5">• Live-Host 引擎热切换，点一下即刻生效</text>

    <rect x="26" y="160" width="316" height="28" rx="8" fill="#09101E"/>
    <text x="38" y="178" fill="#E9D5FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">git push origin v0.9.x  →  Actions 自动发版</text>
  </g>
</svg>
