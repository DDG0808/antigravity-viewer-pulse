  <text x="56" y="88" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15">告别拥挤按钮与失真统计，将最关键的模型成本、缓存复用、双周期配额与真实生成速度融于一屏</text>

  <!-- Quadrant 1: Progressive Prompt Cache UX -->
  <g transform="translate(48, 118)">
    <rect width="580" height="268" rx="20" fill="#0E1729" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="24" y="22" width="108" height="26" rx="13" fill="#064E3B"/>
    <text x="78" y="39" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700">01 · 缓存透视</text>
    <text x="146" y="40" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">渐进式「会话累计 ⇄ 最近单轮」命中率</text>
    <text x="24" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">主界面直看整场对话省流效率，点击药丸下钻最近一次模型请求，缓存断流秒级预警</text>

    <!-- Primary Session Strip -->
    <rect x="24" y="92" width="532" height="66" rx="14" fill="#081C20" stroke="#10B981" stroke-opacity="0.45"/>
    <text x="42" y="120" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700">会话命中率  91.8%</text>
    <rect x="196" y="104" width="94" height="22" rx="11" fill="#065F46"/>
    <text x="243" y="119" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">已省 $4.62</text>
    <text x="42" y="143" fill="#6EE7B7" fill-opacity="0.82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">累计缓存读取 1,420.5K  /  可复用输入池 1,547.4K</text>
    <rect x="444" y="111" width="96" height="28" rx="14" fill="#10B981" fill-opacity="0.2" stroke="#34D399" stroke-opacity="0.6"/>
    <text x="492" y="129" text-anchor="middle" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700">最近请求 ›</text>

