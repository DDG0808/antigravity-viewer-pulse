    <text x="44" y="122" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">当前模型预算 · Gemini 4 / Claude Sonnet</text>
    <text x="456" y="122" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">512K</text>

