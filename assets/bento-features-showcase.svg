    <text x="78" y="39" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700">02 · 双池配额</text>
    <text x="146" y="40" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">共享模型额度池「5h + 周额度」同屏双检</text>
    <text x="24" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">不再只看单一 5 小时窗口，自动取更紧迫的瓶颈桶预警，避免周限额静默触顶</text>

