    <rect x="24" y="22" width="116" height="26" rx="13" fill="#4C1D95"/>
    <text x="82" y="39" text-anchor="middle" fill="#DDD6FE" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700">04 · 吞吐与账本</text>
    <text x="152" y="40" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">端到端真实 tok/s 校准 &amp; 多币种等价账本</text>
    <text x="24" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">思考模型 (XHigh Thinking) 严格计入 TTFT + 流式总时长，杜绝虚高几千 tok/s 假象</text>

    <rect x="24" y="92" width="532" height="146" rx="14" fill="#09111E" stroke="#1E293B"/>
    <text x="44" y="124" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">公式校准: tok/s = outputTokens / (timeToFirstToken + streamingDuration)</text>

    <rect x="44" y="144" width="156" height="74" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="60" y="168" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">端到端吞吐</text>
    <text x="60" y="200" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">150.0 t/s</text>

    <rect x="212" y="144" width="156" height="74" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="228" y="168" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">首字思考延迟 (TTFT)</text>
    <text x="228" y="200" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">0.48 s</text>

    <rect x="380" y="144" width="156" height="74" rx="12" fill="#0F172A" stroke="#1E293B"/>
    <text x="396" y="168" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5">API 等价折算参考</text>
    <text x="396" y="200" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="800">¥ 33.4</text>
