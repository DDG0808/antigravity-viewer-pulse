    <text x="24" y="70" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">移除驾驶舱冗余冲突档位，统一在「预算」页按模型独立设定并注入 maxTokenLimit</text>

