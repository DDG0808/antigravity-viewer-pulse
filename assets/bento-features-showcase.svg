    <text x="150" y="184" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">128K</text>
    <text x="256" y="184" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">256K</text>
    <text x="358" y="184" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">512K</text>
    <text x="494" y="184" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">1M Max</text>

    <text x="44" y="218" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12">✓ 新建会话第 1 轮自动绑定模型预算  ·  选择 &gt;256K 自动联动上下文解锁</text>
