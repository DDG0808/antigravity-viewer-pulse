    <rect x="44" y="148" width="328" height="10" rx="5" fill="url(#violetGrad)"/>
    <circle cx="372" cy="153" r="11" fill="#F8FAFC" stroke="#818CF8" stroke-width="4"/>

    <!-- Stops -->
