    <text x="42" y="224" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">单轮命中 94.1%</text>
    <text x="164" y="224" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">cacheRead: 204.0K · newInput: 12.8K · 缓存稳定复用</text>
  </g>

